<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анонимная Видеорулетка</title>
  
  <!-- Подключаем официальный скрипт Jitsi -->
  <script src="https://meet.jit.si/external_api.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 14px;
      text-align: center;
      background-color: #1e293b;
      font-weight: bold;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    #meet {
      flex: 1;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>🔥 МОЯ ВИДЕОРУЛЕТКА (Jitsi)</header>

  <!-- Контейнер, куда встроен видеоплеер -->
  <div id="meet"></div>

  <script>
    const domain = 'meet.jit.si';
    const options = {
      // Имя комнаты: уникальный адрес для твоей рулетки
      roomName: 'MyAnonymousChatRoulette1v1_777',
      width: '100%',
      height: '100%',
      parentNode: document.querySelector('#meet'),
      configOverwrite: {
        startWithAudioMuted: false,
        startWithVideoMuted: false,
        prejoinPageEnabled: false // Отключаем лишний экран ожидания для быстрого входа
      },
      interfaceConfigOverwrite: {
        TOOLBAR_BUTTONS: [
          'microphone', 'camera', 'desktop', 'fullscreen',
          'fittoscreen', 'hangup', 'tileview'
        ]
      }
    };
    
    // Запуск видеоконференции
    const api = new JitsiMeetExternalAPI(domain, options);
  </script>

</body>
</html>
